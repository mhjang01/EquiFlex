checkpoint: weights/weights.ckpt
output_root: data
num_samples: 10
num_steps: 20
schedule: uniform
seed: 42
device: cuda
score_summary: true
force_prepare: false
guidance:
  enabled: true
  t_start: 0.0
  scale: 100.0
  schedule: linear_decay
  bond_coef: 1.0
  angle_coef: 1.0
  vdw_coef: 5.0
  vdw_active_coef: 1.0
  vdw_max_coef: 0.0
  torsion_coef: 0.25
  chiral_coef: 1.0
  chiral_buffer: 0.5236
  grad_clip: 10.0
sde:
  enabled: false
  sigma: 0.1
  eps_w: 0.01
  w_cutoff: 0.85
  mode: both
pocket_provenance:
  cutoff: 5.0
  selector: equiflex.prep.parse.get_pocket_residues
  reference: deposited {ID}_ligand.sdf
  generated_by: scripts/select_pocket.py
systems:
  5SAK_ZRY:
    output_dir: data/5SAK_ZRY
    protein:
      path: data/5SAK_ZRY/inputs/5SAK_ZRY_protein.pdb
      residues:
        A:
        - 35
        - 37
        - 38
        - 79
        - 80
        - 81
        - 83
        - 116
        - 125
        - 219
        - 221
        - 222
        - 226
        - 300
        - 304
    ligand:
      smiles: N=C1N/C(=N\Nc2ccccc2)c2ccccc21
      reference_sdf: data/5SAK_ZRY/inputs/5SAK_ZRY_ligand.sdf
