# Example inference config — PoseBusters system 5SAK_ZRY.
# Run from the repo root:
#     python scripts/run_inference.py --config data/5SAK_ZRY/inference.yaml
#
# Precomputed features ship under data/5SAK_ZRY/system_data/, so featurization
# (ESM3 + UniMol) is skipped. To prep your own system, drop the protein PDB and
# ligand SMILES below and delete system_data/ — run_inference will featurize it.
checkpoint: weights/equiflex_90m.ckpt
output_root: data
num_samples: 10
num_steps: 50
schedule: uniform
seed: 42
device: cuda
relax: false
guidance:
  enabled: false
sde:
  enabled: false
systems:
  5SAK_ZRY:
    output_dir: data/5SAK_ZRY
    protein:
      path: data/5SAK_ZRY/inputs/5SAK_ZRY_protein.pdb
      # Pocket residues, per chain (author numbering).
      residues:
        A:
        - 35
        - 79
        - 80
        - 81
        - 83
        - 125
        - 219
        - 221
        - 222
        - 226
        - 300
        - 304
    ligand:
      smiles: N=C1N/C(=N\Nc2ccccc2)c2ccccc21
      reference_sdf: data/5SAK_ZRY/inputs/5SAK_ZRY_ligand.sdf
