# =============================================================================
# Flex Model Configuration - V5 70M (Chemistry-Heavy)
# =============================================================================
# FlexModelV5 (SH-enriched flow trunk with l=1 + l=2 vector channels).
# Total ≈ 69.7M params; chemistry trunk ≈ 70% of params (49.2M vs 20.6M flow).
# Chemistry trunk depth (14 atom + 14 triangle layers) emphasizes scalar
# + pair reasoning; flow trunk carries combined irreps for richer geometry.
#
# To use: set `training.model_class: V5` (already done below). Trainer
# dispatches via `model_cls = {V4: FlexModelV4, V5: FlexModelV5}[...]`.
# =============================================================================

model:
  # Input dimensions (from featurization)
  atom_feat_dim: 299
  bond_feat_dim: 26
  esm_dim: 1536
  unimol_dim: 1536

  # Hidden dimensions
  ns: 512                     # Scalar feature dimension (main hidden dim)
  nv: 8                       # Vector multiplicity (carries l=1 + l=2 in V5)
  pair_hidden_dim: 256        # Pairwise feature dim (triangle update operates here)

  # Architecture — chemistry-heavy
  num_atom_layers: 14         # AtomTransformer + TriangleUpdate pairs
  num_geo_layers: 4           # SH-enriched geometric attention layers

  # Attention
  num_atom_heads: 16          # head_dim_s = ns / num_atom_heads = 32
  num_geo_heads: 4            # head_dim_v = nv / num_geo_heads = 2 (per-head vec)
  attn_dropout: 0.1
  use_gated_attention: true   # QWEN-3 style gated attention
  use_qk_norm: true
  return_attn_stats: false

  # Regularization
  initial_dropout: 0.3
  output_dropout: 0.1

  # Pairwise features
  use_outer_product: false    # AtomTransformer outer product (memory-heavy)

  # Embeddings
  use_embeddings: true        # ESM + UniMol fusion

  # Equivariance
  attenuate_by_dist: true     # EVA attention distance attenuation
  soft_cap: 30.0

  # Time conditioning
  time_embed_dim: 256         # auto-promoted to ns by __post_init__
  time_max_period: 10000

  # Memory optimization
  # 70M with N=200 atoms, B=4 ≈ 30 GiB fwd+bwd; checkpointing recommended.
  use_gradient_checkpointing: true
  gradient_checkpoint_every: 2

# =============================================================================
# Loss Functions
# =============================================================================
loss:
  flow_weight: 1
  num_unrolls: 4

  bond_length_weight: 1.0
  bond_buffer: 0.05

  bond_angle_weight: 1.0
  angle_buffer: 0.05

  # vdW: denominator switched to active-clash count (system-size invariant)
  vdw_weight: 10.0
  vdw_buffer: 0.225

  torsion_weight: 1.0

# =============================================================================
# Data Loading
# =============================================================================
data:
  data_dir: '/NHNHOME/WORKSPACE/0526040024_A/mhjang/flex/data_v2_plinder_flat'
  test_data_dir: '/NHNHOME/WORKSPACE/0526040024_A/mhjang/flex/test_data'
  batch_size: 64              # halved vs base.yaml because V5 ~5× param size
  val_batches: 2000
  num_workers: 4
  shuffle: true
  pin_memory: true
  preload: true
  split_csv: '/NHNHOME/WORKSPACE/0526040024_A/mhjang/flex/data_v2_plinder/splits.csv'

# =============================================================================
# Optimizer (Muon + AdamW)
# =============================================================================
optimizer:
  optimizer_type: 'muon'
  muon_lr: 5.0e-3
  muon_momentum: 0.95
  adam_lr: 1.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-10
  muon_weight_decay: 1.0e-3
  adam_weight_decay: 1.0e-4

# =============================================================================
# Scheduler
# =============================================================================
scheduler:
  warmup_steps: 2000          # longer warmup for larger model
  start_factor: 1.0e-3
  end_factor: 1.0e-5

# =============================================================================
# EMA
# =============================================================================
ema:
  enabled: true
  decay: 0.9999

# =============================================================================
# Logging
# =============================================================================
logging:
  use_wandb: true
  wandb_project: 'flex'
  wandb_run_name: v5_70m_chem_heavy
  wandb_entity: null
  log_every_n_steps: 200
  watch_model: true
  watch_log: 'all'
  watch_log_freq: 500
  checkpoint_dir: 'checkpoints'
  save_top_k: 3
  checkpoint_every_n_steps: 5000

# =============================================================================
# Training
# =============================================================================
training:
  model_class: V5             # selects FlexModelV5 in trainer
  max_steps: 400000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 16 # doubled vs base — effective batch unchanged
  val_check_interval: 5000
  precision: 'bf16-mixed'
  devices: 4
  seed: 990131
  phys_loss_warmup_steps: 5000
  num_rmsd_samples: 50
  num_steps: 50
  timestep_sampler: 'uniform'
  use_config: true
